[package]
name = "spatie-calendar-links"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Freek Van der Herten <freek@spatie.be>"]
description = "Generate add to calendar links for Google, iCal and other calendar systems"
license = "MIT"
repository = "https://github.com/spatie/calendar-links-rust"
homepage = "https://spatie.be/open-source"
documentation = "https://spatie.be/docs/calendar-links-rust/v1/introduction"
readme = "README.md"
keywords = ["spatie", "calendar", "ical", "ics", "google-calendar"]
categories = ["date-and-time", "web-programming"]
include = ["/src/", "/tests/", "/build.rs", "/docs/", "/README.md", "/LICENSE.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/Cargo.lock"]

[dependencies]
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
base64 = "0.23"
md5 = "0.8"
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
strip = true
